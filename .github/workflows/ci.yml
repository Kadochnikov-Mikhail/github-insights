name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: github_insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d github_insights_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Create database schema
        run: |
          PGPASSWORD=password psql \
            -h localhost \
            -U admin \
            -d github_insights_test \
            -f migrations/001_create_github_insights.up.sql

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Run go vet
        run: go vet ./...

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  deploy:
      name: Deploy to VPS
      runs-on: ubuntu-latest
      needs:
        - backend
        - frontend
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      steps:
        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.2.5
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              cd /opt/github-insights
              git pull origin master
              docker compose up -d --build
              docker compose ps